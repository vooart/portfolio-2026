<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOO3D | CS2 Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');

        body {
            /* DEIN NEUES PORSCHE NOIR BILD */
            /* BITTE LAD DAS NEUE BILD ALS "porsche-noir.png" HOCH! */
            background-image: url('porsche-noir.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #050505;

            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            
            position: relative;
        }
        
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.3); /* Nur 30% dunkler, damit das S/W Bild knallt */
            z-index: 1;
        }

        .logo-container {
            position: relative;
            z-index: 2;
            display: flex;
            font-size: 6rem;
            font-weight: 900;
            letter-spacing: -2px;
            text-transform: uppercase;
            align-items: center;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        /* Gemeinsamer Nebel-Effekt für alle */
        .char {
            opacity: 0;
            filter: blur(20px);
            display: inline-block;
        }

        /* VOO - Fett und Weiß */
        .char-v, .char-o {
            color: white;
        }

        /* V Animation */
        .char-v { animation: fogIn 1.5s ease-out forwards; }

        /* O Animationen */
        .char-o { animation: fogRotateIn 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .o1 { animation-delay: 0.4s; }
        .o2 { animation-delay: 0.7s; }

        /* 3D - DAS OUTLINE UPDATE */
        .char-3d {
            /* Das hier ist die Magie für das Outline! */
            -webkit-text-stroke: 1px white; /* Feiner weißer Rand */
            color: transparent; /* Der Kern wird durchsichtig */
            
            transform: translateY(-30px);
            animation: fogSlideDown 1.8s ease-out forwards;
            animation-delay: 1.2s;
            margin-left: 15px; /* Etwas mehr Abstand, damit nichts überkreuzt */
        }

        @keyframes fogIn {
            0% { opacity: 0; filter: blur(20px); transform: scale(1.1); }
            100% { opacity: 1; filter: blur(0); transform: scale(1); }
        }

        @keyframes fogRotateIn {
            0% { opacity: 0; filter: blur(20px); transform: rotate(-90deg) scale(0.8); }
            100% { opacity: 1; filter: blur(0); transform: rotate(0) scale(1); }
        }

        @keyframes fogSlideDown {
            0% { opacity: 0; filter: blur(15px); transform: translateY(-30px); }
            100% { opacity: 1; filter: blur(0); transform: translateY(0); }
        }

        .subtitle {
            position: relative;
            z-index: 2;
            margin-top: 20px;
            font-size: 1rem;
            letter-spacing: 5px;
            color: #aaa; /* Heller, damit es über dem S/W Bild lesbar ist */
            text-transform: uppercase;
            opacity: 0;
            animation: fogIn 2s ease forwards;
            animation-delay: 2.2s;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <span class="char char-v">V</span>
        <span class="char char-o o1">O</span>
        <span class="char char-o o2">O</span>
        <span class="char char-3d">3D</span>
    </div>
    
    <p class="subtitle">CS2 Visual Arts & Motion Design</p>

</body>
</html>
