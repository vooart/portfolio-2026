<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOO3D | CS2 Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');

        body {
            background-image: url('porsche-noir.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #050505;
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        .logo-container {
            position: relative;
            z-index: 2;
            display: flex;
            font-size: 7rem; /* Etwas größer für mehr Impact */
            font-weight: 900;
            text-transform: uppercase;
            align-items: center;
        }

        .char {
            opacity: 0;
            filter: blur(20px);
            display: inline-block;
        }

        /* VOO - Massiv & Weiß */
        .char-v, .char-o {
            color: white;
            letter-spacing: -4px;
        }

        .char-v { animation: fogIn 1.5s ease-out forwards; }
        .char-o { animation: fogRotateIn 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .o1 { animation-delay: 0.4s; }
        .o2 { animation-delay: 0.6s; }

        /* 3D - DER PERFEKTE OUTLINE LOOK */
        .char-3d {
            color: transparent;
            -webkit-text-stroke: 2px white; /* Hier ist die Outline */
            letter-spacing: 8px; /* Mehr Platz, damit das D nicht das 3 berührt */
            margin-left: 20px;
            transform: translateY(-30px);
            animation: fogSlideDown 1.8s ease-out forwards;
            animation-delay: 1s;
        }

        @keyframes fogIn {
            0% { opacity: 0; filter: blur(20px); transform: scale(1.1); }
            100% { opacity: 1; filter: blur(0); transform: scale(1); }
        }

        @keyframes fogRotateIn {
            0% { opacity: 0; filter: blur(20px); transform: rotate(-45deg) scale(0.8); }
            100% { opacity: 1; filter: blur(0); transform: rotate(0) scale(1); }
        }

        @keyframes fogSlideDown {
            0% { opacity: 0; filter: blur(15px); transform: translateY(-40px); }
            100% { opacity: 1; filter: blur(0); transform: translateY(0); }
        }

        .subtitle {
            position: relative;
            z-index: 2;
            margin-top: 10px;
            font-size: 1.1rem;
            letter-spacing: 8px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            opacity: 0;
            animation: fogIn 2s ease forwards;
            animation-delay: 2s;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <span class="char char-v">V</span>
        <span class="char char-o o1">O</span>
        <span class="char char-o o2">O</span>
        <span class="char char-3d">3D</span>
    </div>
    
    <p class="subtitle">CS2 Visual Arts & Motion Design</p>

</body>
</html>
