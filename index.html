<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOO3D | CS2 Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');

        body {
            background-color: #050505;
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .logo-container {
            display: flex;
            font-size: 6rem;
            font-weight: 900;
            letter-spacing: -2px;
            text-transform: uppercase;
            align-items: center;
        }

        /* Gemeinsamer Nebel-Effekt für alle */
        .char {
            opacity: 0;
            filter: blur(20px);
            display: inline-block;
            color: white; /* Alles wieder ausgefüllt! */
        }

        /* V Animation */
        .char-v {
            animation: fogIn 1.5s ease-out forwards;
        }

        /* O Animationen - drehen sich smooth rein */
        .char-o {
            animation: fogRotateIn 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        .o1 { animation-delay: 0.4s; }
        .o2 { animation-delay: 0.7s; }

        /* 3D Animation - Slidet von oben mit Nebel - KEINE OUTLINE MEHR */
        .char-3d {
            transform: translateY(-30px);
            animation: fogSlideDown 1.8s ease-out forwards;
            animation-delay: 1.2s;
            margin-left: 10px;
        }

        @keyframes fogIn {
            0% { opacity: 0; filter: blur(20px); transform: scale(1.1); }
            100% { opacity: 1; filter: blur(0); transform: scale(1); }
        }

        @keyframes fogRotateIn {
            0% { opacity: 0; filter: blur(20px); transform: rotate(-90deg) scale(0.8); }
            100% { opacity: 1; filter: blur(0); transform: rotate(0) scale(1); }
        }

        @keyframes fogSlideDown {
            0% { opacity: 0; filter: blur(15px); transform: translateY(-30px); }
            100% { opacity: 1; filter: blur(0); transform: translateY(0); }
        }

        .subtitle {
            margin-top: 20px;
            font-size: 1rem;
            letter-spacing: 5px;
            color: #444; /* Dunstiges Grau */
            text-transform: uppercase;
            opacity: 0;
            animation: fogIn 2s ease forwards;
            animation-delay: 2.2s;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <span class="char char-v">V</span>
        <span class="char char-o o1">O</span>
        <span class="char char-o o2">O</span>
        <span class="char char-3d">3D</span>
    </div>
    
    <p class="subtitle">CS2 Visual Arts & Motion Design</p>

</body>
</html>
