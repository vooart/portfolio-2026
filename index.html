<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOO3D | Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');

        body {
            background-color: #050505;
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .logo-container {
            display: flex;
            font-size: 5rem;
            font-weight: 900;
            letter-spacing: -2px;
            text-transform: uppercase;
        }

        /* Animation für das V */
        .char-v {
            opacity: 0;
            animation: fadeIn 0.8s ease forwards;
        }

        /* Animation für die O's */
        .char-o {
            opacity: 0;
            display: inline-block;
            animation: rotateIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .o1 { animation-delay: 0.3s; }
        .o2 { animation-delay: 0.5s; }

        /* Animation für 3D */
        .char-3d {
            display: inline-block;
            color: #ff00ea; /* Dein Signature-Pink */
            opacity: 0;
            transform: translateY(-50px);
            animation: slideDown 0.6s ease forwards;
            animation-delay: 1s;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes rotateIn {
            from { transform: rotate(-180deg) scale(0.5); opacity: 0; }
            to { transform: rotate(0) scale(1); opacity: 1; }
        }

        @keyframes slideDown {
            to { transform: translateY(0); opacity: 1; }
        }

        .subtitle {
            margin-top: 10px;
            font-size: 1.2rem;
            color: #666;
            opacity: 0;
            animation: fadeIn 1s ease forwards;
            animation-delay: 1.5s;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <span class="char-v">V</span>
        <span class="char-o o1">O</span>
        <span class="char-o o2">O</span>
        <span class="char-3d">3D</span>
    </div>
    
    <p class="subtitle">3D Artist & Motion Designer</p>

</body>
</html>
